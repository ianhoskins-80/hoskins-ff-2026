<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoskins Fantastical Family Football</title>
<style>
  :root {
    --bg: #14161c;
    --card: #1c1f28;
    --text: #f0f1f4;
    --text-dim: #9198a6;
    --line: #2c303c;

    --red: #d6483f;
    --red-tint: rgba(214, 72, 63, 0.16);
    --red-tint-strong: rgba(214, 72, 63, 0.28);

    --blue: #3f7fd6;
    --blue-tint: rgba(63, 127, 214, 0.16);
    --blue-tint-strong: rgba(63, 127, 214, 0.28);

    --warn: #d6a13f;
    --live: #34c77b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    padding: 28px 20px 60px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .viewer-count {
    position: fixed; top: 10px; left: 10px; z-index: 50;
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--text-dim);
  }
  .viewer-count svg { width: 14px; height: 14px; display: block; flex-shrink: 0; }

  h1 {
    font-family: 'Arial Black', Impact, sans-serif;
    font-weight: 900;
    font-style: italic;
    font-size: clamp(30px, 5vw, 48px);
    letter-spacing: -0.5px;
    margin: 0 0 4px;
  }
  .sub { color: var(--text-dim); font-size: 14px; margin-bottom: 8px; }

  .last-updated { color: var(--text-dim); font-size: 12px; margin-bottom: 28px; }

  h2.section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-dim);
    margin: 36px 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .collapse-toggle {
    background: none; border: none; padding: 4px; margin: 0; cursor: pointer;
    color: var(--text-dim); display: inline-flex; align-items: center; justify-content: center;
    border-radius: 4px;
  }
  .collapse-toggle:hover { color: var(--text); background: var(--line); }
  .collapse-toggle svg { width: 14px; height: 14px; display: block; transition: transform 0.15s; }
  .collapse-toggle.collapsed svg { transform: rotate(-90deg); }

  /* ---- matchups, one block per league ---- */
  .matchup-block { border-radius: 6px; overflow: hidden; margin-bottom: 18px; border: 1px solid var(--line); }
  .matchup-block-head { padding: 12px 18px; color: #fff; }
  .matchup-block-head a { color: #fff; text-decoration: none; }
  .matchup-block-head a:hover { text-decoration: underline; }
  .matchup-block.red .matchup-block-head { background: var(--red); }
  .matchup-block.blue .matchup-block-head { background: var(--blue); }
  .matchup-block-head-row { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 15px; }
  .matchup-block-head .week-note { font-weight: 400; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; opacity: 0.85; }
  .matchup-block-totals { margin-top: 4px; font-size: 11px; opacity: 0.85; font-variant-numeric: tabular-nums; }

  .matchup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; padding: 14px; }
  .matchup-block.red .matchup-grid { background: var(--red-tint); }
  .matchup-block.blue .matchup-grid { background: var(--blue-tint); }

  .matchup-card { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; }
  .team-block { padding: 4px 0; }
  .team-top { display: flex; justify-content: space-between; align-items: baseline; }
  .team-name-wrap { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .team-espn-link { flex-shrink: 0; display: inline-flex; color: var(--text-dim); }
  .team-espn-link:hover { color: var(--text); }
  .team-espn-link svg { width: 13px; height: 13px; display: block; }
  button.team-name.roster-trigger {
    background: none; border: none; padding: 0; margin: 0; font: inherit;
    font-weight: 600; font-size: 13px; color: var(--text); cursor: pointer;
    text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  button.team-name.roster-trigger:hover { text-decoration: underline; }
  .team-top .score { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text-dim); flex-shrink: 0; padding-left: 8px; }
  .team-block.winning .team-top { border-radius: 4px; padding: 3px 6px; margin: -3px -6px 0; }
  .team-block.winning .score { font-weight: 700; }
  .matchup-block.red .team-block.winning .team-top { background: var(--red-tint); }
  .matchup-block.red .team-block.winning .score { color: var(--red); }
  .matchup-block.blue .team-block.winning .team-top { background: var(--blue-tint); }
  .matchup-block.blue .team-block.winning .score { color: var(--blue); }
  .team-metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px 10px; margin-top: 5px; }
  .metric { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim); }
  .metric[hidden] { display: none; }
  .metric .metric-value { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .vs-divider { text-align: center; padding: 4px 0; }
  button.vs-divider.matchup-trigger {
    display: flex; align-items: center; justify-content: center; width: 100%;
    background: none; border: none; padding: 3px 0; cursor: pointer; color: var(--text-dim);
  }
  button.vs-divider.matchup-trigger svg { width: 14px; height: 14px; }
  button.vs-divider.matchup-trigger:hover { color: var(--text); }

  /* ---- combined standings table ---- */
  table { width: 100%; border-collapse: collapse; font-size: 14px; border-radius: 6px; overflow: hidden; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim); padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--card); }
  th.num, td.num, th.rank-col, td.rank-col { text-align: center; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); }

  tr.row-red { background: var(--red-tint); border-left: 3px solid var(--red); }
  tr.row-blue { background: var(--blue-tint); border-left: 3px solid var(--blue); }
  tr.row-red:hover { background: var(--red-tint-strong); }
  tr.row-blue:hover { background: var(--blue-tint-strong); }

  .team-name { font-weight: 700; }
  button.team-name.standings-team-trigger {
    background: none; border: none; padding: 0; margin: 0; font: inherit;
    font-weight: 700; color: var(--text); cursor: pointer; text-align: left;
  }
  button.team-name.standings-team-trigger:hover { text-decoration: underline; }
  .team-owner { color: var(--text-dim); font-size: 12px; margin-left: 15px; }
  .rank-badge { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; font-weight: 700; border-radius: 50%; font-size: 12px; color: #fff; }
  tr.row-red .rank-badge { background: var(--red); }
  tr.row-blue .rank-badge { background: var(--blue); }

  .empty-note { padding: 12px 4px; font-size: 12px; color: var(--text-dim); }

  /* ---- points-by-position matrix ---- */
  .matrix-controls-row {
    display: flex; align-items: center; justify-content: flex-end;
    flex-wrap: wrap; gap: 10px; margin-bottom: 12px;
  }
  .matrix-controls-row .filter-pills { margin-right: auto; margin-bottom: 0; }
  .week-select {
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; font-size: 12px; cursor: pointer;
  }
  .filter-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .filter-pill {
    display: inline-flex; align-items: center; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px;
    font-size: 12px; color: var(--text-dim); cursor: pointer;
  }
  .filter-pill:hover { border-color: var(--text-dim); }
  .filter-pill.selected { color: var(--text); border-color: var(--text); background: var(--line); }
  .filter-pill.pill-red { border-color: var(--red); color: var(--red); }
  .filter-pill.pill-red:hover { background: var(--red-tint); }
  .filter-pill.pill-red.selected { background: var(--red-tint-strong); border-color: var(--red); color: var(--red); }
  .filter-pill.pill-blue { border-color: var(--blue); color: var(--blue); }
  .filter-pill.pill-blue:hover { background: var(--blue-tint); }
  .filter-pill.pill-blue.selected { background: var(--blue-tint-strong); border-color: var(--blue); color: var(--blue); }
  .matrix-scroll { overflow-x: auto; }
  .matrix-scroll table { min-width: 560px; }
  td.matrix-cell { cursor: pointer; }
  td.matrix-cell:hover { background: var(--line); }
  td.matrix-projected { font-style: italic; color: var(--text-dim); }
  tr.matrix-total-row { font-weight: 700; border-top: 2px solid var(--line); }
  tr.matrix-total-row td { background: var(--card); }
  tr.matrix-total-row td.matrix-cell:hover { background: var(--line); }

  /* ---- standings trend chart ---- */
  .chart-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
  .chart-svg { width: 100%; height: auto; display: block; }
  .chart-line { fill: none; stroke-width: 2; transition: stroke-width 0.15s, opacity 0.15s; cursor: pointer; }
  .chart-point { transition: opacity 0.15s, r 0.15s; cursor: pointer; }
  .chart-axis-label { fill: var(--text-dim); font-size: 9px; }
  .chart-axis-title { fill: var(--text-dim); font-size: 10px; letter-spacing: 0.4px; }
  .chart-gridline { stroke: var(--line); stroke-width: 1; }
  .chart-gridline-h { stroke: var(--line); stroke-width: 1; opacity: 0.4; }
  .chart-wrap.has-selection .chart-line:not(.selected) { display: none; }
  .chart-wrap.has-selection .chart-point:not(.selected) { display: none; }
  .chart-wrap.has-selection .chart-line.selected { stroke-width: 3; }
  .chart-wrap.has-selection .chart-point.selected { r: 4; }

  .chart-legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chart-legend-chip {
    display: inline-flex; align-items: center; gap: 5px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 3px 9px 3px 7px;
    font-size: 11px; color: var(--text-dim); cursor: pointer;
  }
  .chart-legend-chip:hover { border-color: var(--text-dim); }
  .chart-legend-chip.selected { color: var(--text); border-color: var(--text); background: var(--line); }
  .chart-legend-swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .chart-reset { font-size: 11px; color: var(--text-dim); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 3px 4px; }
  .chart-reset:hover { color: var(--text); }

  .build-footer { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--line); }
  .tour-replay-link { background: none; border: none; color: var(--text-dim); font-size: 11px; cursor: pointer; text-decoration: underline; padding: 0; margin-left: 8px; }
  .tour-replay-link:hover { color: var(--text); }

  /* ---- onboarding tour (illustrative mockups only -- deliberately not
     reusing live interactive classes, so tour content can never trigger
     the real app's click handlers) ---- */
  .tour-mockup { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; margin: 10px 0; font-size: 12px; }
  .tour-mockup-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; }
  .tour-mockup-row + .tour-mockup-row { border-top: 1px solid var(--line); }
  .tour-mockup-divider { text-align: center; padding: 4px 0; margin-top: 6px; color: var(--text-dim); }
  .tour-mockup-divider svg { width: 14px; height: 14px; }
  .tour-mockup-helmet { display: inline-flex; margin-right: 5px; color: var(--text-dim); vertical-align: middle; }
  .tour-mockup-helmet svg { width: 12px; height: 12px; display: block; }
  .tour-mockup-metrics { font-size: 10px; color: var(--text-dim); }
  .tour-mockup-metrics b { color: var(--text); font-weight: 600; }
  .tour-mockup-team { font-weight: 600; display: inline-flex; align-items: center; }
  .tour-mockup-score { color: var(--text-dim); font-variant-numeric: tabular-nums; font-size: 11px; }
  .tour-mockup-pill { display: inline-block; font-size: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 2px 8px; margin-right: 4px; color: var(--text-dim); }
  .tour-mockup-badge { display: inline-block; width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 700; margin-right: 8px; flex-shrink: 0; }
  .tour-mockup-chart { display: block; margin: 10px 0; }
  .tour-feature-list { margin: 10px 0; padding-left: 20px; }
  .tour-feature-list li { margin-bottom: 8px; line-height: 1.4; }
  .tour-feature-list li:last-child { margin-bottom: 0; }
  .tour-dots { display: flex; gap: 5px; justify-content: center; margin-top: 14px; }
  .tour-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .tour-dot.active { background: var(--text-dim); }
  .tour-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
  .tour-nav-buttons { display: flex; gap: 8px; }
  .tour-btn { background: var(--line); color: var(--text); border: none; border-radius: 6px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
  .tour-btn:hover { background: var(--text-dim); color: var(--bg); }
  .tour-btn.primary { background: var(--red); color: #fff; }
  .tour-skip { background: none; border: none; color: var(--text-dim); font-size: 12px; cursor: pointer; text-decoration: underline; padding: 0; }
  .tour-skip:hover { color: var(--text); }

  /* ---- shared lightbox (roster + score history) ---- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 1000;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal-dialog {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    width: 100%; max-width: 480px; max-height: 85vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--line); border-top: 3px solid transparent;
  }
  .modal-dialog.red .modal-header { border-top-color: var(--red); }
  .modal-dialog.blue .modal-header { border-top-color: var(--blue); }
  .modal-header h3 { margin: 0; font-size: 15px; }
  .modal-subtitle { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .modal-close {
    background: none; border: none; color: var(--text-dim); font-size: 24px;
    line-height: 1; cursor: pointer; padding: 4px 8px; flex-shrink: 0; margin-left: 12px;
  }
  .modal-close:hover { color: var(--text); }
  .modal-body { overflow-y: auto; }
  .modal-body table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .modal-body th {
    position: sticky; top: 0; background: var(--card); font-size: 10px;
    text-transform: uppercase; color: var(--text-dim); padding: 8px 12px;
    text-align: left; border-bottom: 1px solid var(--line);
  }
  .modal-body td { padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .modal-body th.num, .modal-body td.num { text-align: right; }
  .modal-body td.pos-cell { color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .injury-badge {
    display: inline-block; font-size: 9px; font-weight: 700; color: var(--warn);
    border: 1px solid var(--warn); border-radius: 3px; padding: 0 3px; margin-left: 4px;
    vertical-align: middle; line-height: 1.4;
  }
  .just-scored-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--live); margin-left: 6px; vertical-align: middle;
  }
  .live-scoring-more { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .live-scoring-more button { font-size: 12px; background: var(--line); color: var(--text); border: none; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  .live-scoring-more button:hover { background: var(--text-dim); color: var(--bg); }
  .live-scoring-count { font-size: 11px; color: var(--text-dim); }
  .live-scoring-team-name.pill-red { color: var(--red); }
  .live-scoring-team-name.pill-blue { color: var(--blue); }
  .modal-group-row td {
    padding: 10px 12px 4px; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.6px; color: var(--text-dim); border-bottom: none;
  }
  /* Only the winning week's "For" score gets tinted -- same treatment as
     the winning-team highlight on matchup cards (subtle background tint
     behind the score, in the team's league color, bold text). */
  .modal-body tr.history-win td.history-my-score { border-radius: 4px; }
  .modal-dialog.red .modal-body tr.history-win td.history-my-score { background: var(--red-tint); color: var(--red); font-weight: 700; }
  .modal-dialog.blue .modal-body tr.history-win td.history-my-score { background: var(--blue-tint); color: var(--blue); font-weight: 700; }
  button.week-link.matchup-trigger {
    background: none; border: none; padding: 0; font: inherit; font-variant-numeric: tabular-nums;
    color: var(--text); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line);
  }
  button.week-link.matchup-trigger:hover { text-decoration-color: var(--text); }

  /* ---- matchup comparison (both rosters, side by side by week) ---- */
  .matchup-side-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 12px; font-weight: 700; font-size: 13px;
    background: var(--card); border-bottom: 1px solid var(--line);
  }
  .matchup-side-head:not(:first-child) { border-top: 1px solid var(--line); }
  .matchup-side-head .matchup-side-score { font-variant-numeric: tabular-nums; }
  .modal-dialog.red .matchup-side-head.winner { background: var(--red-tint); color: var(--red); }
  .modal-dialog.blue .matchup-side-head.winner { background: var(--blue-tint); color: var(--blue); }
  .matchup-caveat { padding: 8px 12px; font-size: 10px; color: var(--text-dim); font-style: italic; }
  .modal-empty { padding: 20px 16px; font-size: 12px; color: var(--text-dim); text-align: center; }

  @media (max-width: 520px) {
    .modal-backdrop { align-items: flex-end; padding: 0; }
    .modal-dialog { max-width: none; max-height: 80vh; border-radius: 14px 14px 0 0; }
  }
</style>
</head>
<body>
<div class="viewer-count" id="viewerCount" hidden></div>
<div class="wrap">
  <h1>Hoskins Fantastical Family Football</h1>
  <div class="last-updated" id="lastUpdated">Loading...</div>

  <section class="page-section" id="matchupsSection">
    <h2 class="section-title">This Week's Matchups<button type="button" class="collapse-toggle" data-collapse-toggle="matchupsSection" title="Minimize section" aria-label="Minimize section"></button></h2>
    <div class="section-body" id="matchupsSectionBody">
      <div id="matchupsContainer"></div>
    </div>
  </section>

  <section class="page-section" id="liveScoringSection" hidden>
    <h2 class="section-title">Live Scoring<button type="button" class="collapse-toggle" data-collapse-toggle="liveScoringSection" title="Minimize section" aria-label="Minimize section"></button></h2>
    <div class="section-body" id="liveScoringSectionBody">
      <div id="liveScoringContainer"></div>
    </div>
  </section>

  <section class="page-section" id="matrixSection">
    <h2 class="section-title">Points by Position<button type="button" class="collapse-toggle" data-collapse-toggle="matrixSection" title="Minimize section" aria-label="Minimize section"></button></h2>
    <div class="section-body" id="matrixSectionBody">
      <div id="matrixContainer"></div>
    </div>
  </section>

  <section class="page-section" id="standingsSection">
    <h2 class="section-title">Combined Standings<button type="button" class="collapse-toggle" data-collapse-toggle="standingsSection" title="Minimize section" aria-label="Minimize section"></button></h2>
    <div class="section-body" id="standingsSectionBody">
      <div id="standingsFilterContainer"></div>
      <table>
        <thead>
          <tr>
            <th class="rank-col"></th>
            <th>Team</th>
            <th class="num">Record</th>
            <th class="num">Win%</th>
            <th class="num">Total Points</th>
            <th class="num">Playoff Odds</th>
          </tr>
        </thead>
        <tbody id="standingsBody"></tbody>
      </table>
    </div>
  </section>

  <section class="page-section" id="chartSection">
    <h2 class="section-title">Standings Trend<button type="button" class="collapse-toggle" data-collapse-toggle="chartSection" title="Minimize section" aria-label="Minimize section"></button></h2>
    <div class="section-body" id="chartSectionBody">
      <div id="chartContainer"></div>
    </div>
  </section>

  <div class="build-footer" id="buildFooter"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal-dialog" id="modalDialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <div>
        <h3 id="modalTitle"></h3>
        <div class="modal-subtitle" id="modalSubtitle"></div>
      </div>
      <button type="button" class="modal-close" id="modalClose" title="Close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------
// The getDashboard Cloud Function's URL (see SETUP.md step 9 for how
// this is derived when bootstrapping a new instance of this project).
// ---------------------------------------------------------------------
const DASHBOARD_API_URL = 'https://us-central1-fantasy2026.cloudfunctions.net/getDashboard';
const HEARTBEAT_URL = 'https://us-central1-fantasy2026.cloudfunctions.net/heartbeat';

// ---------------------------------------------------------------------
// BUILD VERSION
// Bump this on every deploy (see "Versioning" in README.md).
// ---------------------------------------------------------------------
const BUILD_VERSION = 'v17.7';
document.getElementById('buildFooter').innerHTML =
  `Build ${BUILD_VERSION} <button type="button" class="tour-replay-link" id="tourReplayBtn">What's New</button>`;

// Auto-show the onboarding tour on a browser's first-ever visit, and
// again for anyone who already saw an older TOUR_VERSION (tracked in
// localStorage -- see TOUR_STORAGE_KEY / PREVIOUS_TOUR_STORAGE_KEY
// below). It keeps re-showing on every load until the visitor actually
// closes it (any close path marks TOUR_STORAGE_KEY seen -- see
// closeModal), so it's effectively forced until dismissed once. A
// returning visitor who already sat through the old tour jumps straight
// to the new last slide instead of replaying the whole thing; a
// brand-new visitor still gets the full tour from slide 1. Deferred via
// setTimeout both for a short paint-first delay and so TOUR_STORAGE_KEY
// (declared further down this script) is safely initialized by the time
// this callback runs.
setTimeout(() => {
  let alreadySeen = false;
  let sawPreviousVersion = false;
  try {
    alreadySeen = localStorage.getItem(TOUR_STORAGE_KEY) === '1';
    sawPreviousVersion = localStorage.getItem(PREVIOUS_TOUR_STORAGE_KEY) === '1';
  } catch (e) { /* private browsing etc. */ }
  if (!alreadySeen) startTour(sawPreviousVersion ? TOUR_STEPS.length - 1 : 0);
}, 400);

// ---------------------------------------------------------------------
// Collapsible sections -- every top-level section (#matchupsSection,
// #liveScoringSection, #matrixSection, #standingsSection, #chartSection)
// has a minimize/maximize toggle in its header. Collapsing hides only
// `.section-body` (the title stays visible), and since the toggle wraps
// *around* each section's own render function rather than being
// recreated by it, collapse state survives the 5-min auto-refresh with
// no extra bookkeeping. Persisted to localStorage (same mechanism as the
// tour's "seen it" flag) so it also survives a page reload.
// ---------------------------------------------------------------------
const COLLAPSE_STORAGE_PREFIX = 'ff-section-collapsed-';

function isSectionCollapsed(sectionId) {
  try { return localStorage.getItem(COLLAPSE_STORAGE_PREFIX + sectionId) === '1'; } catch (e) { return false; }
}

function applySectionCollapsed(sectionId, collapsed) {
  const body = document.getElementById(sectionId + 'Body');
  const toggle = document.querySelector(`[data-collapse-toggle="${sectionId}"]`);
  if (body) body.hidden = collapsed;
  if (toggle) {
    toggle.classList.toggle('collapsed', collapsed);
    const label = collapsed ? 'Maximize section' : 'Minimize section';
    toggle.title = label;
    toggle.setAttribute('aria-label', label);
  }
}

function toggleSectionCollapsed(sectionId) {
  const collapsed = !isSectionCollapsed(sectionId);
  applySectionCollapsed(sectionId, collapsed);
  try { localStorage.setItem(COLLAPSE_STORAGE_PREFIX + sectionId, collapsed ? '1' : '0'); } catch (e) { /* private browsing etc. -- non-fatal, just won't persist */ }
}

function initCollapsibleSections() {
  document.querySelectorAll('.collapse-toggle').forEach(btn => {
    btn.innerHTML = CHEVRON_SVG;
    const sectionId = btn.dataset.collapseToggle;
    applySectionCollapsed(sectionId, isSectionCollapsed(sectionId));
  });
}

// ESPN-sourced strings (team names, league names, owner names) are
// user-editable in ESPN's UI and get rendered via innerHTML below --
// escape them so a malicious name can't inject markup/script.
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ESPN's numeric IDs for player position, roster slot, and NFL team --
// not documented anywhere official, but stable and widely relied on.
const POSITION_NAMES = { 1: 'QB', 2: 'RB', 3: 'WR', 4: 'TE', 5: 'K', 16: 'D/ST' };
const SLOT_NAMES = { 0: 'QB', 2: 'RB', 3: 'RB/WR', 4: 'WR', 5: 'WR/TE', 6: 'TE', 7: 'OP', 16: 'D/ST', 17: 'K', 19: 'HC', 20: 'BE', 21: 'IR', 23: 'FLEX' };
// Column set for the points-by-position matrix -- real positions (not
// roster slots), so a FLEX-WR counts under WR rather than a separate
// FLEX column.
const POSITION_COLUMNS = ['QB', 'RB', 'WR', 'TE', 'D/ST', 'K', 'HC'];
const PRO_TEAM_ABBR = {
  0: 'FA', 1: 'ATL', 2: 'BUF', 3: 'CHI', 4: 'CIN', 5: 'CLE', 6: 'DAL', 7: 'DEN',
  8: 'DET', 9: 'GB', 10: 'TEN', 11: 'IND', 12: 'KC', 13: 'LV', 14: 'LAR', 15: 'MIA',
  16: 'MIN', 17: 'NE', 18: 'NO', 19: 'NYG', 20: 'NYJ', 21: 'PHI', 22: 'ARI', 23: 'PIT',
  24: 'LAC', 25: 'SF', 26: 'SEA', 27: 'TB', 28: 'WSH', 29: 'CAR', 30: 'JAX', 33: 'BAL', 34: 'HOU',
};
// ACTIVE (healthy) and unset intentionally have no abbreviation -- nothing to flag.
const INJURY_ABBR = {
  QUESTIONABLE: 'Q',
  DOUBTFUL: 'D',
  OUT: 'O',
  INJURY_RESERVE: 'IR',
  DAY_TO_DAY: 'DTD',
  SUSPENSION: 'SUSP',
  PROBABLE: 'P',
  DEACTIVATED: 'INACT',
};

// ESPN member names come back in whatever casing the user typed at
// sign-up (often all-caps) -- standardize to one capital per word so
// "ADAM HOSKINS" and "adam hoskins" both render as "Adam Hoskins".
function toTitleCase(str) {
  return (str || '').split(' ').filter(Boolean)
    .map(w => w[0].toUpperCase() + w.slice(1).toLowerCase())
    .join(' ');
}

function memberName(data, ownerId) {
  const m = (data.members || []).find(mm => mm.id === ownerId);
  return m ? toTitleCase(m.firstName + ' ' + m.lastName) : '';
}

// Currently Playing / Yet to Play / Mins Left, driven by `gameStatus`
// (the backend's per-NFL-team live status from the public ESPN
// scoreboard -- see fetchNflGameStatus/buildLiveScoringBoard in the
// backend, and Live Scoring above). This used to be inferred from
// whether ESPN had posted any actual stat for a player, which doesn't
// distinguish a game still in progress from one that already ended (and
// wrongly counted a bye-week player as "yet to play" instead of neither).
// A starter whose NFL team isn't in `gameStatus` at all (bye week, or the
// scoreboard fetch failed this cycle) counts toward neither bucket.
function computePlayCounts(sideData) {
  const entries = sideData?.rosterForCurrentScoringPeriod?.entries || [];
  // lineupSlotId 20 = bench, 21 = IR -- exclude those, only count starters.
  // Guard against a null entry (e.g. an unfilled roster slot) rather than erroring.
  const starters = entries.filter(e => e && e.lineupSlotId !== 20 && e.lineupSlotId !== 21);

  let playing = 0;
  let yetToPlay = 0;
  let minsLeft = null; // time left until this team's LAST currently-playing starter's game ends
  starters.forEach(entry => {
    const player = entry.playerPoolEntry?.player;
    const nflTeam = PRO_TEAM_ABBR[player?.proTeamId];
    const status = nflTeam ? gameStatus[nflTeam] : null;
    if (!status) return;
    if (status.state === 'in') {
      playing++;
      if (status.secondsRemaining != null) {
        minsLeft = minsLeft == null ? status.secondsRemaining : Math.max(minsLeft, status.secondsRemaining);
      }
    } else if (status.state === 'pre') {
      yetToPlay++;
    }
  });

  return { playing, yetToPlay, minsLeft: minsLeft != null ? Math.ceil(minsLeft / 60) : null };
}

function renderMatchupsBlock(league, leagueIdx) {
  const { data, color } = league;
  const teams = data.teams || [];
  const schedule = data.schedule || [];
  const week = data.status?.currentMatchupPeriod ?? 1;
  const teamById = id => teams.find(t => t.id === id);
  // Standardize card order within a league -- ascending alphabetical by
  // home team name -- instead of ESPN's own schedule order, which is
  // effectively arbitrary (matchup-id order, not anything meaningful here).
  const weekGames = schedule
    .filter(g => g.matchupPeriodId === week)
    .sort((a, b) => {
      const aName = teamById(a.home?.teamId)?.name || '';
      const bName = teamById(b.home?.teamId)?.name || '';
      return aName.localeCompare(bName);
    });
  if (!weekGames.length) return '';

  const leagueUrl = `https://fantasy.espn.com/football/league?leagueId=${data.id}`;
  const leagueName = escapeHtml(data.settings?.name || 'League');
  const teamUrl = teamId => `https://fantasy.espn.com/football/team?leagueId=${data.id}&teamId=${teamId}`;
  const anyScores = weekGames.some(g => (g.home?.totalPoints || 0) > 0 || (g.away?.totalPoints || 0) > 0);

  const renderTeamBlock = (side, sideName, matchupId, teamId, points, proj, isWinning) => {
    const team = teamById(teamId);
    const counts = computePlayCounts(side);
    const name = escapeHtml(team ? team.name : 'TBD');
    return `
      <div class="team-block ${isWinning ? 'winning' : ''}">
        <div class="team-top">
          <span class="team-name-wrap">
            <a class="team-espn-link" href="${teamUrl(teamId)}" target="_blank" rel="noopener noreferrer" title="View ${name} on ESPN" aria-label="View ${name} on ESPN">${HELMET_SVG}</a>
            <button type="button" class="team-name roster-trigger" data-league-idx="${leagueIdx}" data-matchup-id="${escapeHtml(matchupId)}" data-side="${sideName}" title="View ${name}'s roster">${name}</button>
          </span>
          <span class="score">${points.toFixed(1)}</span>
        </div>
        <div class="team-metrics">
          <div class="metric"><span class="metric-label">Currently Playing</span><span class="metric-value">${counts.playing}</span></div>
          <div class="metric"><span class="metric-label">Yet to Play</span><span class="metric-value">${counts.yetToPlay}</span></div>
          <div class="metric"><span class="metric-label">Mins Left</span><span class="metric-value">${counts.minsLeft != null ? counts.minsLeft : '—'}</span></div>
          <div class="metric"><span class="metric-label">Projected</span><span class="metric-value">${proj.toFixed(1)}</span></div>
        </div>
      </div>`;
  };

  const cards = weekGames.map(g => {
    const hp = g.home?.totalPoints ?? 0;
    const ap = g.away?.totalPoints ?? 0;
    const hProj = g.home?.totalProjectedPoints ?? 0;
    const aProj = g.away?.totalProjectedPoints ?? 0;
    const homeWinning = anyScores && hp > ap;
    const awayWinning = anyScores && ap > hp;
    return `
      <div class="matchup-card">
        ${renderTeamBlock(g.away, 'away', g.id, g.away?.teamId, ap, aProj, awayWinning)}
        <button type="button" class="vs-divider matchup-trigger" data-league-idx="${leagueIdx}" data-matchup-id="${g.id}" title="Compare full rosters" aria-label="Compare full rosters">${COMPARE_SVG}</button>
        ${renderTeamBlock(g.home, 'home', g.id, g.home?.teamId, hp, hProj, homeWinning)}
      </div>`;
  }).join('');

  const status = anyScores ? '' : ' — not yet started';

  const leagueTotals = weekGames.reduce((acc, g) => {
    acc.projected += (g.home?.totalProjectedPoints ?? 0) + (g.away?.totalProjectedPoints ?? 0);
    acc.accumulated += (g.home?.totalPoints ?? 0) + (g.away?.totalPoints ?? 0);
    return acc;
  }, { projected: 0, accumulated: 0 });
  // t.record.overall.pointsFor only counts weeks ESPN has already
  // finalized -- it doesn't include the current, still-in-progress week
  // at all, so a plain sum of it stays frozen all week even as real
  // points are being scored. leagueTotals.accumulated (above) is that
  // missing piece: the live current-week total, from the same
  // backend-patched totalPoints field the matchup cards read.
  const seasonTotal = teams.reduce((sum, t) => sum + (t.record?.overall?.pointsFor ?? 0), 0) + leagueTotals.accumulated;
  const totalsLine = `Week Projected ${leagueTotals.projected.toFixed(1)}`
    + (anyScores ? ` · Week Total ${leagueTotals.accumulated.toFixed(1)}` : '')
    + ` · Season Total ${seasonTotal.toFixed(1)}`;

  return `
    <div class="matchup-block ${color}">
      <div class="matchup-block-head">
        <div class="matchup-block-head-row">
          <a href="${leagueUrl}" target="_blank" rel="noopener noreferrer" title="View ${leagueName} on ESPN">${leagueName}</a>
          <span class="week-note">Week ${week}${status}</span>
        </div>
        <div class="matchup-block-totals">${totalsLine}</div>
      </div>
      <div class="matchup-grid">${cards}</div>
    </div>`;
}

// Looks up each league's display name, keyed by color -- shared by the
// pill filters and the sort helper below, so both agree on what a
// league is "named" for ordering/labeling purposes.
function leagueNameLookup() {
  const leagueNameByColor = {};
  leagues.forEach(l => { leagueNameByColor[l.color] = l.data.settings?.name || l.color; });
  return leagueNameByColor;
}

// Standardizes league order everywhere a league appears -- matchup
// blocks and every pill filter -- as ascending alphabetical by league
// name, rather than whatever order each section's own data happened to
// produce (e.g. standings sorted by points, chart by team). Takes a
// list of colors (already deduped) and returns them reordered.
function sortedLeagueColors(colorsPresent) {
  const leagueNameByColor = leagueNameLookup();
  return [...colorsPresent].sort((a, b) =>
    (leagueNameByColor[a] || a).localeCompare(leagueNameByColor[b] || b));
}

// Shared league-filter pill row, used by This Week's Matchups, Combined
// Standings, Points by Position, and the standings chart. Self-activating:
// returns '' (no pills at all) until more than one league actually has
// data, so it appears on its own once League 2 joins rather than needing
// a code change anywhere that calls this.
function renderLeagueFilterPills(colorsPresent, currentFilter, dataAttr) {
  if (colorsPresent.length <= 1) return '';
  const leagueNameByColor = leagueNameLookup();
  const pills = ['all', ...colorsPresent].map(val => {
    const label = val === 'all' ? 'All Leagues' : escapeHtml(leagueNameByColor[val] || val);
    const selected = currentFilter === val ? 'selected' : '';
    const colorClass = val === 'all' ? '' : `pill-${val}`;
    return `<button type="button" class="filter-pill ${colorClass} ${selected}" data-${dataAttr}="${val}">${label}</button>`;
  }).join('');
  return `<div class="filter-pills">${pills}</div>`;
}

// The same real NFL player can be rostered by a team in EACH league at
// once (two separate, independently-drafted leagues) -- without this,
// a shared player would show up as two identical-looking rows (same
// real stat line, so always the same points) rather than one row
// naming both teams. Groups by playerId and collects every team that
// currently has that player rostered.
function groupLiveScoringByPlayer(players) {
  const byPlayer = new Map();
  players.forEach(p => {
    if (!byPlayer.has(p.playerId)) {
      byPlayer.set(p.playerId, {
        playerId: p.playerId,
        playerName: p.playerName,
        position: p.position,
        points: p.points,
        justScored: p.justScored,
        teams: [],
      });
    }
    byPlayer.get(p.playerId).teams.push({ teamId: p.teamId, teamName: p.teamName, leagueColor: p.leagueColor });
  });
  return [...byPlayer.values()];
}

// Live Scoring -- every rostered starter whose real NFL team is currently
// mid-game and who has actually scored, sorted highest points first (see
// buildLiveScoringBoard in the backend). Self-hides the whole section
// (heading included, via the `hidden` attribute on #liveScoringSection)
// whenever the list is empty -- unlike every other section on the page,
// which keeps its heading visible even with nothing under it -- since
// "no one rostered is currently playing" is the common case most of the
// week, not an edge case worth a permanent empty-state message.
function renderLiveScoringBoard() {
  const section = document.getElementById('liveScoringSection');
  if (!liveScoring.length) {
    section.hidden = true;
    return;
  }
  section.hidden = false;

  const colorsPresent = sortedLeagueColors([...new Set(liveScoring.map(p => p.leagueColor))]);
  const pillsHtml = renderLeagueFilterPills(colorsPresent, liveScoringLeagueFilter, 'live-scoring-filter');
  const leagueFilterActive = colorsPresent.length > 1 && liveScoringLeagueFilter !== 'all';
  const leagueFilteredPlayers = leagueFilterActive ? liveScoring.filter(p => p.leagueColor === liveScoringLeagueFilter) : liveScoring;

  // Team multi-select -- same idea as the standings chart: with 1+ teams
  // selected, every other team's players are fully hidden (not shown at
  // all), not just dimmed, so isolating a couple of teams out of many
  // stays legible. Reuses the standings chart's own chart-legend-chip
  // markup and teamLineColorForTeam() shading (not the league-filter
  // pills' red/blue-border style) so a team's chip looks and colors
  // identically here and on the chart, not just similarly.
  const teamsPresent = [...new Map(
    leagueFilteredPlayers.map(p => [`${p.leagueColor}:${p.teamId}`, { key: `${p.leagueColor}:${p.teamId}`, teamId: p.teamId, teamName: p.teamName, leagueColor: p.leagueColor }])
  ).values()].sort((a, b) => a.teamName.localeCompare(b.teamName));
  const teamFilterActive = selectedLiveScoringTeamKeys.size > 0;

  // Group first (across the full league-filtered list, so a shared
  // player's *other* team is known about), then apply the team filter to
  // the grouped rows -- a player passes if ANY of their teams is
  // selected, but only the selected team(s) are shown on that row, not
  // an unrelated team you didn't ask to isolate.
  let displayPlayers = groupLiveScoringByPlayer(leagueFilteredPlayers);
  if (teamFilterActive) {
    displayPlayers = displayPlayers
      .map(p => ({ ...p, teams: p.teams.filter(t => selectedLiveScoringTeamKeys.has(`${t.leagueColor}:${t.teamId}`)) }))
      .filter(p => p.teams.length > 0);
  }
  displayPlayers.sort((a, b) => b.points - a.points);

  const teamChipsHtml = teamsPresent.length > 1 ? `
    <div class="filter-pills">
      ${teamsPresent.map(t => `<button type="button" class="chart-legend-chip ${selectedLiveScoringTeamKeys.has(t.key) ? 'selected' : ''}" data-live-scoring-team="${t.key}" title="Filter to ${escapeHtml(t.teamName)} only"><span class="chart-legend-swatch" style="background:${teamLineColorForTeam(t.leagueColor, t.teamId)}"></span>${escapeHtml(t.teamName)}</button>`).join('')}
      ${teamFilterActive ? '<button type="button" class="chart-reset" id="liveScoringTeamReset">Show all</button>' : ''}
    </div>` : '';

  // Only the most recent 25 (of whatever's currently filtered) render by
  // default -- this data can grow to hundreds of rows by the end of a
  // game, and re-rendering every one of them every 5-min refresh would
  // both flood the screen and get slower over the course of a Sunday.
  // liveScoringVisibleCount persists across refreshes (see loadDashboard)
  // so an expanded view doesn't collapse back to 25 on its own; it only
  // resets when the filter actually changes, since that's effectively a
  // new view.
  const visiblePlayers = displayPlayers.slice(0, liveScoringVisibleCount);
  const rowsHtml = visiblePlayers.map(p => {
    const positionLabel = p.position ? escapeHtml(p.position) + ' ' : '';
    const dot = p.justScored ? '<span class="just-scored-dot" title="Scored in the last update"></span>' : '';
    // A player on just one team keeps the same red/blue row tint as
    // before; a shared player's row stays neutral (can't tint for two
    // leagues at once) and instead color-codes each team name inline.
    const rowClass = p.teams.length === 1 ? `row-${p.teams[0].leagueColor}` : '';
    const teamsHtml = p.teams.map(t => `<span class="live-scoring-team-name pill-${t.leagueColor}">${escapeHtml(t.teamName)}</span>`).join(', ');
    return `
      <tr class="${rowClass}">
        <td>${teamsHtml}</td>
        <td>${positionLabel}${escapeHtml(p.playerName)}${dot}</td>
        <td class="num">${p.points.toFixed(1)}</td>
      </tr>`;
  }).join('');

  const remaining = displayPlayers.length - visiblePlayers.length;
  const loadMoreHtml = remaining > 0
    ? `<div class="live-scoring-more"><button type="button" id="liveScoringLoadMore">Show ${Math.min(25, remaining)} more</button><span class="live-scoring-count">Showing ${visiblePlayers.length} of ${displayPlayers.length}</span></div>`
    : displayPlayers.length > 25
      ? `<div class="live-scoring-count">Showing all ${displayPlayers.length}</div>`
      : '';

  document.getElementById('liveScoringContainer').innerHTML = `
    ${pillsHtml}
    ${teamChipsHtml}
    <table>
      <thead><tr><th>Team</th><th>Player</th><th class="num">Points</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    ${loadMoreHtml}`;
}

function renderAll() {
  const matchupsColorsPresent = sortedLeagueColors([...new Set(leagues.map(l => l.color))]);
  const matchupsPillsHtml = renderLeagueFilterPills(matchupsColorsPresent, matchupsLeagueFilter, 'matchups-filter');
  const matchupsFilterActive = matchupsColorsPresent.length > 1 && matchupsLeagueFilter !== 'all';
  // Filter which league blocks render, but keep each league's *original*
  // index (leagueIdx) intact -- roster/matchup modals look teams up via
  // leagues[leagueIdx], so re-indexing a filtered subarray would break them.
  // Display order follows matchupsColorsPresent (ascending by league name),
  // same standardized order as the pill filters above.
  const matchupsBlocksHtml = matchupsColorsPresent
    .map(color => ({ league: leagues.find(l => l.color === color), i: leagues.findIndex(l => l.color === color) }))
    .filter(({ league }) => !matchupsFilterActive || league.color === matchupsLeagueFilter)
    .map(({ league, i }) => renderMatchupsBlock(league, i))
    .join('');
  document.getElementById('matchupsContainer').innerHTML = matchupsPillsHtml + matchupsBlocksHtml;

  let allRows = [];
  leagues.forEach((league, leagueIdx) => {
    const { data, color } = league;
    (data.teams || []).forEach(t => allRows.push({ team: t, data, color, leagueIdx }));
  });

  allRows.sort((a, b) => {
    const apf = a.team.record?.overall?.pointsFor ?? 0;
    const bpf = b.team.record?.overall?.pointsFor ?? 0;
    if (bpf !== apf) return bpf - apf;
    // pointsFor is tied for everyone before Week 1 kicks off -- break the
    // tie by playoff odds (already shown as a column) rather than ESPN's
    // opaque currentProjectedRank, so the order means something visible.
    const aPct = a.team.currentSimulationResults?.playoffPct ?? -1;
    const bPct = b.team.currentSimulationResults?.playoffPct ?? -1;
    if (bPct !== aPct) return bPct - aPct;
    return (a.team.currentProjectedRank ?? 99) - (b.team.currentProjectedRank ?? 99);
  });
  // Assign each row its combined (cross-league) rank before filtering, so
  // filtering to one league narrows which rows are *visible* without
  // changing what "rank" means -- this table is the combined standings,
  // so a filtered view still shows each team's true overall position
  // rather than re-numbering 1..N within just that league.
  allRows.forEach((row, i) => { row.rank = i + 1; });

  const leagueColorsPresent = sortedLeagueColors([...new Set(allRows.map(r => r.color))]);
  document.getElementById('standingsFilterContainer').innerHTML =
    renderLeagueFilterPills(leagueColorsPresent, standingsLeagueFilter, 'standings-filter');

  const filterActive = leagueColorsPresent.length > 1 && standingsLeagueFilter !== 'all';
  const filteredRows = filterActive ? allRows.filter(r => r.color === standingsLeagueFilter) : allRows;

  const rows = filteredRows.map(row => {
    const t = row.team;
    const rec = t.record?.overall;
    const recordStr = rec ? `${rec.wins}-${rec.losses}${rec.ties ? '-' + rec.ties : ''}` : '—';
    const gamesPlayed = rec ? rec.wins + rec.losses + (rec.ties || 0) : 0;
    const winPct = gamesPlayed > 0 ? Math.round(((rec.wins + (rec.ties || 0) * 0.5) / gamesPlayed) * 100) + '%' : '—';
    const pf = rec ? rec.pointsFor.toFixed(1) : '0.0';
    const playoffPct = t.currentSimulationResults?.playoffPct;
    const pctStr = playoffPct != null ? (playoffPct * 100).toFixed(2) + '%' : '—';
    const owner = memberName(row.data, t.primaryOwner);
    return `
      <tr class="row-${row.color}">
        <td class="rank-col"><span class="rank-badge">${row.rank}</span></td>
        <td><button type="button" class="team-name standings-team-trigger" data-league-idx="${row.leagueIdx}" data-team-id="${t.id}" data-color="${row.color}" title="View ${escapeHtml(t.name)}'s score history">${escapeHtml(t.name)}</button><span class="team-owner">${escapeHtml(owner)}</span></td>
        <td class="num">${recordStr}</td>
        <td class="num">${winPct}</td>
        <td class="num">${pf}</td>
        <td class="num">${pctStr}</td>
      </tr>`;
  }).join('');

  document.getElementById('standingsBody').innerHTML = rows ||
    '<tr><td colspan="6" class="empty-note">No leagues loaded yet.</td></tr>';
}

// ---------------------------------------------------------------------
// Points-by-position matrix -- one row per team, one column per real
// position (not roster slot -- a FLEX-WR counts under WR). Cell value
// is that position's summed actual points this week (falls back to
// projected, shown in italics, before kickoff); hover/click reveals
// which specific starter(s) contributed. Built entirely from data
// already in `leagues` (the same per-game roster data behind the
// roster lightbox and matchup comparison) -- no backend changes.
//
// Row keys are `${leagueColor}:${teamId}` throughout, not the raw
// ESPN team id, since that id is only unique *within* one league (see
// the same fix applied to the standings chart above).
// ---------------------------------------------------------------------
function currentWeekAcrossLeagues() {
  return leagues[0]?.data?.status?.currentMatchupPeriod ?? 1;
}

// ESPN's `rosterForCurrentScoringPeriod` is only populated for whichever
// week is presently active -- every other week's schedule entry comes
// back empty (confirmed against the live API, not just "possibly
// stale"). So a past week's roster can only come from our own
// `rosterHistory` snapshots (see snapshotCurrentWeekRosters in the
// backend), never from `leagues` itself. Returns null if no snapshot
// was captured for that week (e.g. it predates this feature).
function getRosterHistoryWeek(week) {
  return rosterHistory.find(w => w.week === week) || null;
}

function emptyPositionBuckets() {
  const positions = {};
  POSITION_COLUMNS.forEach(p => { positions[p] = { actualSum: 0, projectedSum: 0, hasActual: false, hasUnplayed: false, players: [] }; });
  return positions;
}

// A position cell's total should be "points actually scored so far,"
// not a number padded with projections for players who haven't played
// yet -- summing actual-where-available + projected-as-filler (the
// original approach) let one real stat among several still-projected
// players produce a solid-looking total that was mostly a guess. Once
// *any* player in the group has actually played, the total is the sum
// of real stats ONLY (unplayed players contribute nothing, not their
// projection); only while literally nobody has played yet does it fall
// back to the summed projection, as a pre-kickoff estimate. Called once
// per bucket after every player's been added (buckets accumulate both
// sums as they go, since which one to use isn't known until the whole
// group's been seen).
function finalizePositionBuckets(positions) {
  Object.values(positions).forEach(bucket => {
    bucket.total = bucket.hasActual ? bucket.actualSum : bucket.projectedSum;
    bucket.allActual = bucket.hasActual && !bucket.hasUnplayed;
  });
  return positions;
}

function buildPositionMatrixRowsLive(week) {
  const rows = [];

  leagues.forEach((league) => {
    const { data, color } = league;
    const teams = data.teams || [];
    const weekGames = (data.schedule || []).filter(g => g.matchupPeriodId === week);
    const teamById = id => teams.find(t => t.id === id);

    weekGames.forEach(g => {
      ['home', 'away'].forEach(side => {
        const sideData = g[side];
        if (!sideData) return;
        const team = teamById(sideData.teamId);
        const entries = (sideData.rosterForCurrentScoringPeriod?.entries || []).filter(Boolean);
        const starters = entries.filter(e => e.lineupSlotId !== 20 && e.lineupSlotId !== 21);

        const positions = emptyPositionBuckets();
        starters.forEach(entry => {
          const player = entry.playerPoolEntry?.player || {};
          const posKey = POSITION_NAMES[player.defaultPositionId] || SLOT_NAMES[entry.lineupSlotId];
          const bucket = positions[posKey];
          if (!bucket) return; // unmapped position -- skip rather than error
          const { actual, projected } = playerPointsRaw(player, week);
          if (actual != null) {
            bucket.actualSum += actual;
            bucket.hasActual = true;
          } else {
            bucket.hasUnplayed = true;
          }
          bucket.projectedSum += actual != null ? actual : (projected != null ? projected : 0);
          bucket.players.push({ name: player.fullName || 'Empty', actual, projected });
        });

        rows.push({
          key: `${color}:${sideData.teamId}`,
          teamName: team ? team.name : 'TBD',
          owner: team ? memberName(data, team.primaryOwner) : '',
          leagueColor: color,
          positions: finalizePositionBuckets(positions),
        });
      });
    });
  });

  return rows;
}

function buildPositionMatrixRowsFromHistory(week) {
  const weekEntry = getRosterHistoryWeek(week);
  if (!weekEntry) return [];

  return Object.entries(weekEntry.teams).map(([key, teamData]) => {
    const positions = emptyPositionBuckets();
    (teamData.players || []).forEach(p => {
      if (p.slot !== 'starter') return;
      const bucket = positions[p.position];
      if (!bucket) return;
      if (p.actual != null) {
        bucket.actualSum += p.actual;
        bucket.hasActual = true;
      } else {
        bucket.hasUnplayed = true;
      }
      bucket.projectedSum += p.actual != null ? p.actual : (p.projected != null ? p.projected : 0);
      bucket.players.push({ name: p.name, actual: p.actual, projected: p.projected });
    });
    return {
      key,
      teamName: teamData.teamName,
      // Snapshots taken before the owner field shipped won't have it --
      // toTitleCase('') is just '', so the span renders empty rather than erroring.
      owner: toTitleCase(teamData.owner || ''),
      leagueColor: teamData.leagueColor,
      positions: finalizePositionBuckets(positions),
    };
  });
}

function buildPositionMatrixRows(week) {
  const rows = week === currentWeekAcrossLeagues()
    ? buildPositionMatrixRowsLive(week)
    : buildPositionMatrixRowsFromHistory(week);
  rows.sort((a, b) => a.teamName.localeCompare(b.teamName));
  return rows;
}

// Shared by the render function (to know what's currently visible) and
// the totals-row modal (to recompute the same set independently) --
// keeps both in agreement about which teams the league filter has hidden.
function filterMatrixRowsByLeague(rows, leagueColorsPresent) {
  const filterActive = leagueColorsPresent.length > 1 && matrixLeagueFilter !== 'all';
  return filterActive ? rows.filter(r => r.leagueColor === matrixLeagueFilter) : rows;
}

// Sums one position's column across every given row, and flattens every
// contributing team's players into one list (each tagged with which team
// it came from) for the "all teams" breakdown modal.
function computePositionTotals(rows, position) {
  let total = 0;
  let allActual = true;
  let hasActual = false;
  const players = [];
  rows.forEach(row => {
    const bucket = row.positions[position];
    if (!bucket || !bucket.players.length) return;
    total += bucket.total;
    if (!bucket.allActual) allActual = false;
    if (bucket.hasActual) hasActual = true;
    bucket.players.forEach(p => players.push({ ...p, teamName: row.teamName, leagueColor: row.leagueColor }));
  });
  return { total, allActual, hasActual, players };
}

function renderPositionMatrix() {
  const container = document.getElementById('matrixContainer');

  if (!leagues.length) {
    container.innerHTML = '<div class="empty-note">No matchups loaded yet.</div>';
    return;
  }

  const currentWeek = currentWeekAcrossLeagues();
  const effectiveWeek = matrixSelectedWeek != null ? matrixSelectedWeek : currentWeek;
  const rows = buildPositionMatrixRows(effectiveWeek);

  const weekOptions = [];
  for (let w = 1; w <= currentWeek; w++) weekOptions.push(w);
  const weekSelectHtml = `
    <select class="week-select" id="matrixWeekSelect">
      ${weekOptions.map(w => `<option value="${w}" ${w === effectiveWeek ? 'selected' : ''}>Week ${w}${w === currentWeek ? ' (Current)' : ''}</option>`).join('')}
    </select>`;

  if (!rows.length) {
    const message = effectiveWeek < currentWeek
      ? `No roster snapshot was captured for Week ${effectiveWeek} (snapshots only cover weeks since this feature shipped).`
      : 'No matchups for that week.';
    container.innerHTML = `<div class="matrix-controls-row">${weekSelectHtml}</div><div class="empty-note">${message}</div>`;
    return;
  }

  const leagueColorsPresent = sortedLeagueColors([...new Set(rows.map(r => r.leagueColor))]);
  const pillsHtml = renderLeagueFilterPills(leagueColorsPresent, matrixLeagueFilter, 'matrix-filter');

  const filteredRows = filterMatrixRowsByLeague(rows, leagueColorsPresent);

  const caveatHtml = effectiveWeek < currentWeek
    ? `<div class="matchup-caveat">From the Week ${effectiveWeek} roster snapshot, captured that week.</div>`
    : '';

  const headerCells = POSITION_COLUMNS.map(p => `<th class="num">${p}</th>`).join('');
  const bodyRows = filteredRows.map(row => {
    const cells = POSITION_COLUMNS.map(pos => {
      const bucket = row.positions[pos];
      if (!bucket.players.length) return '<td class="num">—</td>';
      const breakdown = bucket.players
        .map(p => `${p.name}: ${(p.actual ?? p.projected ?? 0).toFixed(1)}${p.actual == null ? ' (proj)' : ''}`)
        .join('\n');
      // Italic (matrix-projected) means "this number is a projection" --
      // only true while hasActual is false (nobody's played, so the
      // total is a pure estimate). A "partial" bucket (some played,
      // some haven't) is NOT italicized even though allActual is false,
      // since its total is 100% real data now (actual-only, see
      // finalizePositionBuckets) -- just not everyone's final tally
      // yet. Italicizing a fully-real number as if it were a guess was
      // the actual bug, not just its label.
      const cls = bucket.hasActual ? 'matrix-cell' : 'matrix-cell matrix-projected';
      return `<td class="num ${cls}" data-team-key="${row.key}" data-position="${pos}" title="${escapeHtml(breakdown)}">${bucket.total.toFixed(1)}</td>`;
    }).join('');
    return `<tr class="row-${row.leagueColor}"><td>${escapeHtml(row.teamName)}<span class="team-owner">${escapeHtml(row.owner)}</span></td>${cells}</tr>`;
  }).join('');

  const totalCells = POSITION_COLUMNS.map(pos => {
    const t = computePositionTotals(filteredRows, pos);
    if (!t.players.length) return '<td class="num">—</td>';
    const cls = t.hasActual ? 'matrix-cell matrix-total-cell' : 'matrix-cell matrix-total-cell matrix-projected';
    return `<td class="num ${cls}" data-position="${pos}" title="Click for the full breakdown across all teams">${t.total.toFixed(1)}</td>`;
  }).join('');
  const totalRowHtml = `<tr class="matrix-total-row"><td>Total</td>${totalCells}</tr>`;

  container.innerHTML = `
    <div class="matrix-controls-row">${pillsHtml}${weekSelectHtml}</div>
    ${caveatHtml}
    <div class="matrix-scroll">
      <table>
        <thead><tr><th>Team</th>${headerCells}</tr></thead>
        <tbody>${bodyRows}${totalRowHtml}</tbody>
      </table>
    </div>`;
}

// Labels a position total as "(projected)" when nobody contributing has
// played yet, "(partial)" when some have and some haven't -- so the
// total isn't fully real, but isn't a pure projection either -- or
// nothing at all once everyone has.
function positionTotalSuffix(allActual, hasAnyActual, hasAnyPlayers) {
  if (!hasAnyPlayers || allActual) return '';
  return hasAnyActual ? ' (partial)' : ' (projected)';
}

function openPositionCellModal({ teamKey, position }) {
  const effectiveWeek = matrixSelectedWeek != null ? matrixSelectedWeek : currentWeekAcrossLeagues();
  const rows = buildPositionMatrixRows(effectiveWeek);
  const row = rows.find(r => r.key === teamKey);
  if (!row) return;
  const bucket = row.positions[position];
  if (!bucket) return;

  const playerRows = bucket.players.length
    ? bucket.players.map(p => `
        <tr>
          <td>${escapeHtml(p.name)}</td>
          <td class="num">${p.projected != null ? p.projected.toFixed(1) : '—'}</td>
          <td class="num">${p.actual != null ? p.actual.toFixed(1) : '—'}</td>
        </tr>`).join('')
    : '<tr><td colspan="3" class="empty-note">No starters at this position.</td></tr>';

  const hasAnyActual = bucket.players.some(p => p.actual != null);
  openModal({
    title: `${row.teamName} — ${position}`,
    subtitle: `Week ${effectiveWeek} — Total: ${bucket.total.toFixed(1)}${positionTotalSuffix(bucket.allActual, hasAnyActual, bucket.players.length > 0)}`,
    bodyHtml: `<table><thead><tr><th>Player</th><th class="num">Proj</th><th class="num">Actual</th></tr></thead><tbody>${playerRows}</tbody></table>`,
    color: row.leagueColor,
  });
}

// Totals-row modal -- same idea as openPositionCellModal above, but
// spans every (league-filter-visible) team instead of just one, so each
// player row also names which team it came from. Recomputes from
// scratch rather than reading anything cached from the last render, same
// pattern as openPositionCellModal.
function openPositionTotalModal(position) {
  const effectiveWeek = matrixSelectedWeek != null ? matrixSelectedWeek : currentWeekAcrossLeagues();
  const rows = buildPositionMatrixRows(effectiveWeek);
  const leagueColorsPresent = [...new Set(rows.map(r => r.leagueColor))];
  const filteredRows = filterMatrixRowsByLeague(rows, leagueColorsPresent);
  const { total, allActual, players } = computePositionTotals(filteredRows, position);
  const hasAnyActual = players.some(p => p.actual != null);

  const sortedPlayers = [...players].sort((a, b) => a.teamName.localeCompare(b.teamName));

  const playerRows = sortedPlayers.length
    ? sortedPlayers.map(p => `
        <tr>
          <td>${escapeHtml(p.name)}</td>
          <td>${escapeHtml(p.teamName)}</td>
          <td class="num">${p.projected != null ? p.projected.toFixed(1) : '—'}</td>
          <td class="num">${p.actual != null ? p.actual.toFixed(1) : '—'}</td>
        </tr>`).join('')
    : '<tr><td colspan="4" class="empty-note">No starters at this position.</td></tr>';

  openModal({
    title: `All Teams — ${position}`,
    subtitle: `Week ${effectiveWeek} — Total: ${total.toFixed(1)}${positionTotalSuffix(allActual, hasAnyActual, sortedPlayers.length > 0)}`,
    bodyHtml: `<table><thead><tr><th>Player</th><th>Team</th><th class="num">Proj</th><th class="num">Actual</th></tr></thead><tbody>${playerRows}</tbody></table>`,
    color: null,
  });
}

// ---------------------------------------------------------------------
// Standings trend chart -- one line per team, X = week, Y = combined
// rank (inverted, rank 1 at top). Built from `standingsHistory`
// (weekly snapshots written server-side once each week completes).
// Colors are generated per-league (red/blue hue) with lightness spread
// across teams in that league, rather than hardcoding a 16-color
// palette, so it scales automatically as leagues/teams are added.
// ---------------------------------------------------------------------
function teamLineColor(leagueColor, indexInLeague, totalInLeague) {
  const hue = leagueColor === 'blue' ? 213 : 6;
  const t = totalInLeague > 1 ? indexInLeague / (totalInLeague - 1) : 0;
  const lightness = 42 + t * 36; // spread dark -> light across teams in the league
  return `hsl(${hue}, 72%, ${lightness}%)`;
}

// Same per-team color-shade as teamLineColor above, but keyed off the
// live team roster (leagues) rather than a standingsHistory snapshot --
// lets a section render this before Standings Trend has (or without
// depending on it at all), while still landing on the identical shade
// for a given team, so Live Scoring's team chips read as the same
// color-coding system as the chart's legend, not just a similar one.
function teamLineColorForTeam(leagueColor, teamId) {
  const league = leagues.find(l => l.color === leagueColor);
  const ids = (league?.data.teams || []).map(t => t.id).sort((a, b) => a - b);
  return teamLineColor(leagueColor, ids.indexOf(teamId), ids.length);
}

function renderStandingsChart() {
  const container = document.getElementById('chartContainer');

  if (!standingsHistory.length) {
    container.innerHTML = '<div class="chart-wrap"><div class="empty-note">No completed weeks yet — check back after Week 1 wraps up.</div></div>';
    return;
  }

  // ESPN's numeric team IDs are only unique *within* a league -- two
  // different leagues can (and likely will) both have a team with id 1.
  // Key everything by leagueColor:teamId instead of the raw id so teams
  // from different leagues never collide/merge into one line.
  const teamKey = s => `${s.leagueColor}:${s.teamId}`;

  const latestWeek = standingsHistory[standingsHistory.length - 1];
  const teamIds = latestWeek.standings.map(teamKey);
  const totalTeams = teamIds.length;

  // Stable per-league color-shade assignment (sorted by teamId so it
  // doesn't reshuffle from week to week).
  const byLeagueColor = {};
  latestWeek.standings.forEach(s => {
    (byLeagueColor[s.leagueColor] = byLeagueColor[s.leagueColor] || []).push(s.teamId);
  });
  Object.values(byLeagueColor).forEach(ids => ids.sort((a, b) => a - b));

  // A team's standings-history teamName is frozen at whatever it was
  // called when that week's snapshot was written -- if the team renames
  // itself afterward (a real thing that happens), that name goes stale
  // until the next weekly snapshot lands, which can be up to a week
  // away (or forever, for the write-once preseason doc). Prefer the
  // live current name (same leagueColor:teamId lookup used everywhere
  // else in the app) and only fall back to the snapshotted name if the
  // team can't be found live.
  const liveNameByKey = {};
  leagues.forEach(l => {
    (l.data.teams || []).forEach(t => { liveNameByKey[`${l.color}:${t.id}`] = t.name; });
  });

  const teamMeta = {};
  latestWeek.standings.forEach(s => {
    const key = teamKey(s);
    const group = byLeagueColor[s.leagueColor] || [];
    teamMeta[key] = {
      name: liveNameByKey[key] || s.teamName,
      lineColor: teamLineColor(s.leagueColor, group.indexOf(s.teamId), group.length),
    };
  });

  const seriesByTeam = {};
  teamIds.forEach(id => { seriesByTeam[id] = []; });
  standingsHistory.forEach(weekEntry => {
    weekEntry.standings.forEach(s => {
      const key = teamKey(s);
      if (!seriesByTeam[key]) seriesByTeam[key] = [];
      seriesByTeam[key].push({ week: weekEntry.week, rank: s.rank, pointsFor: s.pointsFor });
    });
  });

  // League filter narrows which teams' lines/legend entries are drawn --
  // like Combined Standings, it doesn't change the rank axis itself
  // (totalTeams stays the full cross-league count), since rank here is
  // always the true combined position.
  const leagueColorByKey = {};
  latestWeek.standings.forEach(s => { leagueColorByKey[teamKey(s)] = s.leagueColor; });
  const chartColorsPresent = sortedLeagueColors([...new Set(latestWeek.standings.map(s => s.leagueColor))]);
  const chartPillsHtml = renderLeagueFilterPills(chartColorsPresent, chartLeagueFilter, 'chart-filter');
  const chartFilterActive = chartColorsPresent.length > 1 && chartLeagueFilter !== 'all';
  const visibleTeamIds = chartFilterActive ? teamIds.filter(id => leagueColorByKey[id] === chartLeagueFilter) : teamIds;

  const weeks = standingsHistory.map(w => w.week);
  const minWeek = Math.min(...weeks);
  const maxWeek = Math.max(...weeks);

  const W = 700, H = 380;
  const padL = 40, padR = 16, padT = 12, padB = 36;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const xForWeek = w => weeks.length > 1 ? padL + ((w - minWeek) / (maxWeek - minWeek)) * plotW : padL + plotW / 2;
  const yForRank = r => padT + ((r - 1) / Math.max(1, totalTeams - 1)) * plotH;

  // Week 0 is the seeded preseason snapshot (see seedPreseasonStandingsSnapshot
  // in the backend) -- label it "Pre" on the axis and "Preseason" in point
  // tooltips rather than the literal week number, since there's no actual
  // NFL "Week 0" and a bare 0 would read as a typo next to 1, 2, 3...
  const weekAxisLabel = w => w === 0 ? 'Pre' : String(w);
  const weekTooltipLabel = w => w === 0 ? 'Preseason' : `Week ${w}`;

  let gridSvg = '';
  for (let w = minWeek; w <= maxWeek; w++) {
    const x = xForWeek(w);
    gridSvg += `<line class="chart-gridline" x1="${x}" y1="${padT}" x2="${x}" y2="${padT + plotH}"></line>`;
    gridSvg += `<text class="chart-axis-label" x="${x}" y="${padT + plotH + 14}" text-anchor="middle">${weekAxisLabel(w)}</text>`;
  }
  gridSvg += `<text class="chart-axis-title" x="${padL + plotW / 2}" y="${H - 4}" text-anchor="middle">Week</text>`;

  let yLabelsSvg = '';
  for (let r = 1; r <= totalTeams; r++) {
    gridSvg += `<line class="chart-gridline-h" x1="${padL}" y1="${yForRank(r)}" x2="${padL + plotW}" y2="${yForRank(r)}"></line>`;
    yLabelsSvg += `<text class="chart-axis-label" x="${padL - 8}" y="${yForRank(r) + 3}" text-anchor="end">${r}</text>`;
  }
  const yTitleX = 12;
  const yTitleY = padT + plotH / 2;
  yLabelsSvg += `<text class="chart-axis-title" x="${yTitleX}" y="${yTitleY}" text-anchor="middle" transform="rotate(-90 ${yTitleX} ${yTitleY})">Rank (1 = best)</text>`;

  let linesSvg = '';
  let pointsSvg = '';
  visibleTeamIds.forEach(id => {
    const meta = teamMeta[id];
    const series = seriesByTeam[id].slice().sort((a, b) => a.week - b.week);
    if (!series.length) return;
    const pointsAttr = series.map(p => `${xForWeek(p.week)},${yForRank(p.rank)}`).join(' ');
    linesSvg += `<polyline class="chart-line" data-team-id="${id}" points="${pointsAttr}" stroke="${meta.lineColor}"></polyline>`;
    series.forEach(p => {
      pointsSvg += `<circle class="chart-point" data-team-id="${id}" cx="${xForWeek(p.week)}" cy="${yForRank(p.rank)}" r="3" fill="${meta.lineColor}"><title>${escapeHtml(meta.name)} — ${weekTooltipLabel(p.week)}: Rank ${p.rank}, ${p.pointsFor.toFixed(1)} pts</title></circle>`;
    });
  });

  const legendChips = visibleTeamIds.slice().sort((a, b) => {
    const ra = seriesByTeam[a][seriesByTeam[a].length - 1]?.rank ?? 999;
    const rb = seriesByTeam[b][seriesByTeam[b].length - 1]?.rank ?? 999;
    return ra - rb;
  }).map(id => {
    const meta = teamMeta[id];
    return `<button type="button" class="chart-legend-chip" data-team-id="${id}" title="Toggle ${escapeHtml(meta.name)}"><span class="chart-legend-swatch" style="background:${meta.lineColor}"></span>${escapeHtml(meta.name)}</button>`;
  }).join('');

  container.innerHTML = `
    ${chartPillsHtml}
    <div class="chart-wrap" id="chartWrap">
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Combined standings rank by week">
        ${gridSvg}${yLabelsSvg}${linesSvg}${pointsSvg}
      </svg>
      <div class="chart-legend">
        ${legendChips}
        <button type="button" class="chart-reset" id="chartReset">Show all</button>
      </div>
    </div>`;

  applyChartSelection();
}

function applyChartSelection() {
  const wrap = document.getElementById('chartWrap');
  if (!wrap) return;
  wrap.classList.toggle('has-selection', selectedChartTeamIds.size > 0);
  wrap.querySelectorAll('[data-team-id]').forEach(el => {
    el.classList.toggle('selected', selectedChartTeamIds.has(String(el.dataset.teamId)));
  });
}

function toggleChartSelection(teamId) {
  teamId = String(teamId);
  if (selectedChartTeamIds.has(teamId)) {
    selectedChartTeamIds.delete(teamId);
  } else {
    selectedChartTeamIds.add(teamId);
  }
  applyChartSelection();
}

// popup (click a team name in the standings table). Both are rebuilt

// element's HTML) so they always reflect the latest fetched data.
// ---------------------------------------------------------------------
const modalBackdrop = document.getElementById('modalBackdrop');
const modalDialog = document.getElementById('modalDialog');

function openModal({ title, subtitle, bodyHtml, color }) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalSubtitle').textContent = subtitle || '';
  document.getElementById('modalBody').innerHTML = bodyHtml;
  modalDialog.classList.remove('red', 'blue');
  if (color) modalDialog.classList.add(color);

  modalBackdrop.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('modalClose').focus();
}

function closeModal() {
  if (tourActive) {
    tourActive = false;
    try { localStorage.setItem(TOUR_STORAGE_KEY, '1'); } catch (e) { /* private browsing etc. -- non-fatal, tour just re-shows next visit */ }
  }
  modalBackdrop.hidden = true;
  document.body.style.overflow = '';
}
