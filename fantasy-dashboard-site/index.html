function renderTourStep() {
  const step = TOUR_STEPS[tourStepIndex];
  const isFirst = tourStepIndex === 0;
  const isLast = tourStepIndex === TOUR_STEPS.length - 1;
  const dots = TOUR_STEPS.map((_, i) => `<span class="tour-dot ${i === tourStepIndex ? 'active' : ''}"></span>`).join('');

  const bodyHtml = `
    ${step.body}
    <div class="tour-dots">${dots}</div>
    <div class="tour-nav">
      <button type="button" class="tour-skip" data-tour-action="skip">Skip</button>
      <div class="tour-nav-buttons">
        ${!isFirst ? '<button type="button" class="tour-btn" data-tour-action="prev">Back</button>' : ''}
        <button type="button" class="tour-btn primary" data-tour-action="${isLast ? 'finish' : 'next'}">${isLast ? 'Got it' : 'Next'}</button>
      </div>
    </div>`;

  openModal({
    title: step.title,
    subtitle: `Step ${tourStepIndex + 1} of ${TOUR_STEPS.length}`,
    bodyHtml,
    color: null,
  });
}

function startTour(stepIndex = 0) {
  tourActive = true;
  tourStepIndex = stepIndex;
  renderTourStep();
}

function playerPointsRaw(player, scoringPeriodId) {
  const stats = player.stats || [];
  const actual = stats.find(s => s.scoringPeriodId === scoringPeriodId && s.statSourceId === 0);
  const projected = stats.find(s => s.scoringPeriodId === scoringPeriodId && s.statSourceId === 1);
  return {
    actual: actual ? actual.appliedTotal : null,
    projected: projected ? projected.appliedTotal : null,
  };
}

function playerStatsFor(player, scoringPeriodId) {
  const { actual, projected } = playerPointsRaw(player, scoringPeriodId);
  return {
    actual: actual != null ? actual.toFixed(1) : '—',
    projected: projected != null ? projected.toFixed(1) : '—',
  };
}

// Per-player kickoff time in the roster modal, from gameStatus.date (see
// fetchNflGameStatus in the backend). Only meaningful for the CURRENT
// week -- gameStatus reflects the live scoreboard, not history, so
// rosterRowFromHistory (past weeks) doesn't show a Game column at all.
// Formatted in the viewer's own local timezone rather than a hardcoded
// one, since ESPN's own preformatted strings shift to "Final" / "Q2
// 5:26" once a game starts, which isn't useful as a stable kickoff time.
function gameTimeLabel(nflTeamAbbr) {
  const date = nflTeamAbbr ? gameStatus[nflTeamAbbr]?.date : null;
  if (!date) return '—';
  return new Date(date).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' });
}

function rosterRow(entry, week) {
  // entry.playerPoolEntry (or the player within it) can be missing for an
  // unfilled roster slot -- fall back to placeholder text rather than erroring.
  const player = entry?.playerPoolEntry?.player || {};
  const pos = POSITION_NAMES[player.defaultPositionId] || SLOT_NAMES[entry?.lineupSlotId] || '—';
  const nflTeamAbbr = PRO_TEAM_ABBR[player.proTeamId];
  const nflTeam = nflTeamAbbr ?? '—';
  const gameTime = gameTimeLabel(nflTeamAbbr);
  const { projected, actual } = playerStatsFor(player, week);
  const injuryAbbr = INJURY_ABBR[player.injuryStatus];
  const injuryBadge = injuryAbbr ? ` <span class="injury-badge" title="${escapeHtml(player.injuryStatus)}">${injuryAbbr}</span>` : '';
  return `
    <tr>
      <td class="pos-cell">${escapeHtml(pos)}</td>
      <td>${escapeHtml(player.fullName || 'Empty')}${injuryBadge}</td>
      <td>${escapeHtml(nflTeam)}</td>
      <td>${escapeHtml(gameTime)}</td>
      <td class="num">${projected}</td>
      <td class="num">${actual}</td>
    </tr>`;
}

function renderRosterBody(sideData, week) {
  const entries = (sideData?.rosterForCurrentScoringPeriod?.entries || []).filter(Boolean);
  const starters = entries.filter(e => e.lineupSlotId !== 20 && e.lineupSlotId !== 21)
    .sort((a, b) => a.lineupSlotId - b.lineupSlotId);
  const bench = entries.filter(e => e.lineupSlotId === 20);
  const ir = entries.filter(e => e.lineupSlotId === 21);

  const section = (label, list) => list.length
    ? `<tr class="modal-group-row"><td colspan="6">${label}</td></tr>${list.map(e => rosterRow(e, week)).join('')}`
    : '';

  return `
    <table>
      <thead>
        <tr>
          <th>Pos</th>
          <th>Player</th>
          <th>Team</th>
          <th>Game</th>
          <th class="num">Proj</th>
          <th class="num">Actual</th>
        </tr>
      </thead>
      <tbody>
        ${section('Starters', starters)}
        ${section('Bench', bench)}
        ${section('IR', ir)}
      </tbody>
    </table>`;
}

// Parallel to rosterRow()/renderRosterBody() above, but sourced from our
// own roster-history snapshot shape (already has position/team/points
// resolved server-side) instead of ESPN's live rosterForCurrentScoringPeriod
// shape -- used for any week that isn't the current one, since ESPN's live
// data is empty for those (see getRosterHistoryWeek() for why).
function rosterRowFromHistory(p) {
  const injuryAbbr = INJURY_ABBR[p.injuryStatus];
  const injuryBadge = injuryAbbr ? ` <span class="injury-badge" title="${escapeHtml(p.injuryStatus)}">${injuryAbbr}</span>` : '';
  const projected = p.projected != null ? p.projected.toFixed(1) : '—';
  const actual = p.actual != null ? p.actual.toFixed(1) : '—';
  return `
    <tr>
      <td class="pos-cell">${escapeHtml(p.position || '—')}</td>
      <td>${escapeHtml(p.name || 'Empty')}${injuryBadge}</td>
      <td>${escapeHtml(p.nflTeam || '—')}</td>
      <td class="num">${projected}</td>
      <td class="num">${actual}</td>
    </tr>`;
}

function renderRosterBodyFromHistory(teamData) {
  if (!teamData) return '<div class="modal-empty">No roster snapshot available for this week.</div>';

  const players = teamData.players || [];
  const starters = players.filter(p => p.slot === 'starter').sort((a, b) => (a.lineupSlotId ?? 99) - (b.lineupSlotId ?? 99));
  const bench = players.filter(p => p.slot === 'bench');
  const ir = players.filter(p => p.slot === 'ir');

  const section = (label, list) => list.length
    ? `<tr class="modal-group-row"><td colspan="5">${label}</td></tr>${list.map(rosterRowFromHistory).join('')}`
    : '';

  return `
    <table>
      <thead>
        <tr>
          <th>Pos</th>
          <th>Player</th>
          <th>Team</th>
          <th class="num">Proj</th>
          <th class="num">Actual</th>
        </tr>
      </thead>
      <tbody>
        ${section('Starters', starters)}
        ${section('Bench', bench)}
        ${section('IR', ir)}
      </tbody>
    </table>`;
}

function openRosterModal({ leagueIdx, matchupId, side }) {
  const league = leagues[Number(leagueIdx)];
  if (!league) return;
  const game = (league.data.schedule || []).find(g => String(g.id) === String(matchupId));
  if (!game) return;
  const sideData = game[side];
  const team = (league.data.teams || []).find(t => t.id === sideData?.teamId);
  const week = league.data.status?.currentMatchupPeriod ?? 1;

  openModal({
    title: team ? team.name : 'Roster',
    subtitle: `Week ${week}`,
    bodyHtml: renderRosterBody(sideData, week),
    color: league.color,
  });
}

// ---------------------------------------------------------------------
// Score-history lightbox -- opened by clicking a team name in the
// combined standings table. Walks every prior week's matchup for that
// team out of `league.data.schedule` (there's no separate "history"
// field -- schedule already holds every week's game, current and past).
// ---------------------------------------------------------------------
function teamScoreHistory(league, teamId) {
  const teams = league.data.teams || [];
  const currentWeek = league.data.status?.currentMatchupPeriod ?? 1;
  const teamById = id => teams.find(t => t.id === id);

  return (league.data.schedule || [])
    .filter(g => g.matchupPeriodId < currentWeek)
    .map(g => {
      const isHome = g.home?.teamId === teamId;
      const isAway = g.away?.teamId === teamId;
      if (!isHome && !isAway) return null;
      const mine = isHome ? g.home : g.away;
      const opp = isHome ? g.away : g.home;
      const myScore = mine?.totalPoints ?? 0;
      const oppScore = opp?.totalPoints ?? 0;
      const oppTeam = teamById(opp?.teamId);
      const result = myScore > oppScore ? 'W' : myScore < oppScore ? 'L' : 'T';
      return { week: g.matchupPeriodId, matchupId: g.id, oppName: oppTeam ? oppTeam.name : 'TBD', myScore, oppScore, result };
    })
    .filter(Boolean)
    .sort((a, b) => a.week - b.week);
}

function renderHistoryBody(league, teamId, leagueIdx) {
  const history = teamScoreHistory(league, teamId);
  if (!history.length) {
    return '<div class="modal-empty">No games played yet this season.</div>';
  }
  const rows = history.map(h => `
    <tr class="${h.result === 'W' ? 'history-win' : ''}">
      <td><button type="button" class="week-link matchup-trigger" data-league-idx="${leagueIdx}" data-matchup-id="${h.matchupId}" title="Compare full rosters for Week ${h.week}">${h.week}</button></td>
      <td>${escapeHtml(h.oppName)}</td>
      <td class="num history-my-score">${h.myScore.toFixed(1)}</td>
      <td class="num">${h.oppScore.toFixed(1)}</td>
      <td class="num">${h.result}</td>
    </tr>`).join('');
  return `
    <table>
      <thead>
        <tr>
          <th>Wk</th>
          <th>Opponent</th>
          <th class="num">For</th>
          <th class="num">Against</th>
          <th class="num">Result</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function openHistoryModal({ leagueIdx, teamId, color }) {
  const league = leagues[Number(leagueIdx)];
  if (!league) return;
  const team = (league.data.teams || []).find(t => String(t.id) === String(teamId));

  openModal({
    title: team ? team.name : 'Score History',
    subtitle: 'Season history',
    bodyHtml: renderHistoryBody(league, Number(teamId), leagueIdx),
    color,
  });
}

// ---------------------------------------------------------------------
// Matchup comparison lightbox -- both teams' full rosters for one
// specific week, side by side. Opened from the "at" divider on a
// matchup card (current week) or a week number in the score-history
// modal (a past week).
//
// Past weeks render from our own roster-history snapshots rather than
// ESPN's live rosterForCurrentScoringPeriod, which is empty for any
// week that isn't presently current (see getRosterHistoryWeek()).
// ---------------------------------------------------------------------
function matchupSideHeader(team, score, isWinner) {
  return `
    <div class="matchup-side-head ${isWinner ? 'winner' : ''}">
      <span>${escapeHtml(team ? team.name : 'TBD')}</span>
      <span class="matchup-side-score">${score.toFixed(1)}</span>
    </div>`;
}

function renderMatchupComparisonBody(game, homeTeam, awayTeam, week, leagueColor, isPastWeek) {
  const homeScore = game.home?.totalPoints ?? 0;
  const awayScore = game.away?.totalPoints ?? 0;
  const homeWinner = homeScore > awayScore;
  const awayWinner = awayScore > homeScore;

  let awayBody, homeBody, caveat;
  if (isPastWeek) {
    const weekEntry = getRosterHistoryWeek(week);
    awayBody = renderRosterBodyFromHistory(weekEntry?.teams?.[`${leagueColor}:${game.away?.teamId}`]);
    homeBody = renderRosterBodyFromHistory(weekEntry?.teams?.[`${leagueColor}:${game.home?.teamId}`]);
    caveat = weekEntry ? `<div class="matchup-caveat">From the Week ${week} roster snapshot, captured that week.</div>` : '';
  } else {
    awayBody = renderRosterBody(game.away, week);
    homeBody = renderRosterBody(game.home, week);
    caveat = '';
  }

  return `
    ${caveat}
    ${matchupSideHeader(awayTeam, awayScore, awayWinner)}
    ${awayBody}
    ${matchupSideHeader(homeTeam, homeScore, homeWinner)}
    ${homeBody}`;
}

function openMatchupModal({ leagueIdx, matchupId }) {
  const league = leagues[Number(leagueIdx)];
  if (!league) return;
  const game = (league.data.schedule || []).find(g => String(g.id) === String(matchupId));
  if (!game) return;
  const teams = league.data.teams || [];
  const homeTeam = teams.find(t => t.id === game.home?.teamId);
  const awayTeam = teams.find(t => t.id === game.away?.teamId);
  const week = game.matchupPeriodId;
  const currentWeek = league.data.status?.currentMatchupPeriod ?? 1;

  openModal({
    title: `${awayTeam ? awayTeam.name : 'TBD'} at ${homeTeam ? homeTeam.name : 'TBD'}`,
    subtitle: `Week ${week}`,
    bodyHtml: renderMatchupComparisonBody(game, homeTeam, awayTeam, week, league.color, week < currentWeek),
    color: league.color,
  });
}

document.addEventListener('click', (e) => {
  const tourAction = e.target.closest('[data-tour-action]');
  if (tourAction) {
    const action = tourAction.dataset.tourAction;
    if (action === 'next') { tourStepIndex = Math.min(tourStepIndex + 1, TOUR_STEPS.length - 1); renderTourStep(); }
    else if (action === 'prev') { tourStepIndex = Math.max(tourStepIndex - 1, 0); renderTourStep(); }
    else { closeModal(); } // 'skip' or 'finish'
    return;
  }
  const collapseToggle = e.target.closest('.collapse-toggle');
  if (collapseToggle) {
    toggleSectionCollapsed(collapseToggle.dataset.collapseToggle);
    return;
  }
  const rosterTrigger = e.target.closest('.roster-trigger');
  if (rosterTrigger) {
    openRosterModal(rosterTrigger.dataset);
    return;
  }
  const historyTrigger = e.target.closest('.standings-team-trigger');
  if (historyTrigger) {
    openHistoryModal(historyTrigger.dataset);
    return;
  }
  const matchupTrigger = e.target.closest('.matchup-trigger');
  if (matchupTrigger) {
    openMatchupModal(matchupTrigger.dataset);
    return;
  }
  const matrixFilterPill = e.target.closest('[data-matrix-filter]');
  if (matrixFilterPill) {
    matrixLeagueFilter = matrixFilterPill.dataset.matrixFilter;
    renderPositionMatrix();
    return;
  }
  const standingsFilterPill = e.target.closest('[data-standings-filter]');
  if (standingsFilterPill) {
    standingsLeagueFilter = standingsFilterPill.dataset.standingsFilter;
    renderAll();
    return;
  }
  const matchupsFilterPill = e.target.closest('[data-matchups-filter]');
  if (matchupsFilterPill) {
    matchupsLeagueFilter = matchupsFilterPill.dataset.matchupsFilter;
    renderAll();
    return;
  }
  const chartFilterPill = e.target.closest('[data-chart-filter]');
  if (chartFilterPill) {
    chartLeagueFilter = chartFilterPill.dataset.chartFilter;
    selectedChartTeamIds.clear();
    renderStandingsChart();
    return;
  }
  const liveScoringFilterPill = e.target.closest('[data-live-scoring-filter]');
  if (liveScoringFilterPill) {
    liveScoringLeagueFilter = liveScoringFilterPill.dataset.liveScoringFilter;
    selectedLiveScoringTeamKeys.clear(); // a new league filter is effectively a new view
    liveScoringVisibleCount = 25;
    renderLiveScoringBoard();
    return;
  }
  const liveScoringTeamChip = e.target.closest('[data-live-scoring-team]');
  if (liveScoringTeamChip) {
    const key = liveScoringTeamChip.dataset.liveScoringTeam;
    if (selectedLiveScoringTeamKeys.has(key)) selectedLiveScoringTeamKeys.delete(key);
    else selectedLiveScoringTeamKeys.add(key);
    liveScoringVisibleCount = 25;
    renderLiveScoringBoard();
    return;
  }
  if (e.target.id === 'liveScoringTeamReset') {
    selectedLiveScoringTeamKeys.clear();
    liveScoringVisibleCount = 25;
    renderLiveScoringBoard();
    return;
  }
  if (e.target.id === 'liveScoringLoadMore') {
    liveScoringVisibleCount += 25;
    renderLiveScoringBoard();
    return;
  }
  const matrixTotalCell = e.target.closest('.matrix-total-cell');
  if (matrixTotalCell) {
    openPositionTotalModal(matrixTotalCell.dataset.position);
    return;
  }
  const matrixCell = e.target.closest('.matrix-cell');
  if (matrixCell) {
    openPositionCellModal(matrixCell.dataset);
    return;
  }
  const chartEl = e.target.closest('#chartContainer [data-team-id]');
  if (chartEl) {
    toggleChartSelection(chartEl.dataset.teamId);
    return;
  }
  if (e.target.id === 'chartReset') {
    selectedChartTeamIds.clear();
    applyChartSelection();
    return;
  }
  if (e.target === modalBackdrop) closeModal();
});
document.getElementById('modalClose').addEventListener('click', closeModal);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !modalBackdrop.hidden) closeModal();
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'matrixWeekSelect') {
    const week = Number(e.target.value);
    matrixSelectedWeek = week === currentWeekAcrossLeagues() ? null : week;
    renderPositionMatrix();
  }
});

async function loadDashboard() {
  try {
    const res = await fetch(DASHBOARD_API_URL, { cache: 'no-store' });
    const payload = await res.json();
    leagues = payload.leagues || [];
    standingsHistory = payload.standingsHistory || [];
    rosterHistory = payload.rosterHistory || [];
    liveScoring = payload.liveScoring || [];
    gameStatus = payload.gameStatus || {};
    renderAll();
    renderPositionMatrix();
    renderStandingsChart();
    renderLiveScoringBoard();
    const el = document.getElementById('lastUpdated');
    el.textContent = payload.updatedAt
      ? 'Last updated ' + new Date(payload.updatedAt).toLocaleTimeString()
      : '';
  } catch (err) {
    console.error('Failed to load dashboard data:', err);
    document.getElementById('lastUpdated').textContent = 'Could not load data — check back shortly.';
  }
}

// Fetch immediately on page load / reload.
loadDashboard();

// Then re-sync every 5 minutes, aligned to the clock (:00, :05, :10, ...)
// so the frontend refresh lines up with the backend's own 5-min cache cycle.
function scheduleAlignedRefresh() {
  const now = new Date();
  const msPastFive = ((now.getMinutes() % 5) * 60 + now.getSeconds()) * 1000 + now.getMilliseconds();
  const msToNextMark = (5 * 60 * 1000) - msPastFive;
  setTimeout(() => {
    loadDashboard();
    setInterval(loadDashboard, 5 * 60 * 1000);
  }, msToNextMark);
}
scheduleAlignedRefresh();

// ---------------------------------------------------------------------
// "Currently viewing" count (top-left corner) -- a lightweight
// heartbeat, not a real-time subscription (this app has no WebSocket/
// realtime layer). Each tab pings the heartbeat endpoint with a random
// per-tab sessionId every ~25s; the backend upserts a presence doc and
// returns how many tabs have pinged in the last 90s (see
// PRESENCE_TIMEOUT_MS in the backend) -- a closed or backgrounded tab
// just ages out of that count on its own, no disconnect handling needed.
// Only heartbeats while the tab is actually visible (Page Visibility
// API), since a backgrounded tab isn't really being "viewed" -- pauses
// the interval when hidden and sends an immediate ping on becoming
// visible again, rather than waiting for the next tick.
// ---------------------------------------------------------------------
const HEARTBEAT_INTERVAL_MS = 25 * 1000;
const sessionId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
let heartbeatIntervalId = null;

async function sendHeartbeat() {
  try {
    const res = await fetch(HEARTBEAT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId }),
    });
    if (!res.ok) return;
    const { activeCount } = await res.json();
    if (typeof activeCount !== 'number') return;
    const el = document.getElementById('viewerCount');
    el.innerHTML = `${GLASSES_SVG}<span>${activeCount} viewing</span>`;
    el.hidden = false;
  } catch (err) {
    // Non-fatal -- the count just doesn't update this cycle, not worth
    // surfacing a background nicety's failure to the viewer.
    console.error('Heartbeat failed:', err.message);
  }
}

function startHeartbeat() {
  if (heartbeatIntervalId) return;
  sendHeartbeat();
  heartbeatIntervalId = setInterval(sendHeartbeat, HEARTBEAT_INTERVAL_MS);
}

function stopHeartbeat() {
  if (heartbeatIntervalId) {
    clearInterval(heartbeatIntervalId);
    heartbeatIntervalId = null;
  }
}

if (document.visibilityState === 'visible') startHeartbeat();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') startHeartbeat();
  else stopHeartbeat();
});
</script>
